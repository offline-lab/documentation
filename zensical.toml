# Offline Lab — unified documentation
#
# One config builds the whole site. Documentation is organised as distinct
# top-level sections (one per project / tool) so each project keeps its own
# identity in the navigation without being blended into a single tree.
#
# Layout:
#   docs/   -> markdown source (one subdir per section)
#   site/   -> hand-written website HTML (copied to the web root at build)
#   public/ -> generated output (gitignored); docs render under public/docs/

[project]

site_name        = "Offline Lab"
site_description = "Open tools for offline and air-gapped computing environments."
site_author      = "Offline Lab"
site_url         = "https://offline-lab.com/docs/"
home_page_url    = "https://offline-lab.com"

copyright = "Copyright &copy; 2026 Offline Lab"

repo_name = "offline-lab/documentation"
repo_url  = "https://github.com/offline-lab/documentation"
edit_uri  = "https://github.com/offline-lab/documentation/edit/main/docs/"

docs_dir = "docs"
site_dir = "public/docs"

# Each top-level entry is a self-contained documentation section.
# `navigation.sections` + `navigation.indexes` render these as distinct
# section groups, each anchored on its own index page.
